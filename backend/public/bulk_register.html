<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulk Register 50 Users</title>
  <style>
    body {font-family: 'Inter', sans-serif; background: #0a1128; color: #f0f4ff; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0;}
    button {background: linear-gradient(135deg, #60a5fa, #8b5cf6); color:#fff; padding:12px 24px; border:none; border-radius:8px; font-size:1rem; cursor:pointer; transition: transform .2s;}
    button:hover {transform:scale(1.05);}
    #log {margin-top:20px; max-height:300px; overflow:auto; width:80%; background:rgba(5,10,24,0.6); padding:10px; border-radius:8px;}
    .log-entry {margin:4px 0;}
    .error {color:#ef4444;}
  </style>
</head>
<body>
  <h1>Register 50 Test Users</h1>
  <button id="startBtn">Start Bulk Registration</button>
  <div id="log"></div>
  <script>
    const logDiv = document.getElementById('log');
    function log(msg, type='info') {
      const el = document.createElement('div');
      el.className = 'log-entry';
      el.textContent = msg;
      if (type === 'error') el.classList.add('error');
      logDiv.appendChild(el);
    }
    document.getElementById('startBtn').addEventListener('click', async () => {
      document.getElementById('startBtn').disabled = true;
      const promises = [];
      for (let i = 0; i < 50; i++) {
        const email = `bulk${i}_${Date.now()}@example.com`;
        const payload = {
          email,
          team_name: `Bulk Team ${i}_${Date.now()}`,
          participant_name: `Participant ${i}`,
          phone_number: `123456` + String(1000 + i)
        };
        const p = fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(data => {
          if (data.success) {
            log(`✅ Registered ${data.team_id}`);
          } else {
            log(`❌ Failed ${email}: ${data.error || 'unknown'}`, 'error');
          }
        })
        .catch(err => log(`❌ Network error for ${email}: ${err.message}`, 'error'));
        promises.push(p);
      }
      await Promise.all(promises);
      log('All registration attempts completed.');
    });
  </script>
</body>
</html>
