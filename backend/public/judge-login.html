<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Think to Build | Judge Login</title>
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    .judge-login-card {
      max-width: 460px;
      margin: 120px auto 40px;
      text-align: center;
      position: relative;
      z-index: 10;
    }
    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: rgba(96, 165, 250, 0.12);
      border: 1px solid rgba(96, 165, 250, 0.25);
      color: #60a5fa;
      margin-bottom: 20px;
      font-family: var(--font-mono);
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .error-msg {
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
      font-weight: 500;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .back-home-link {
      color: var(--blue-400);
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-home-link:hover {
      color: var(--blue-500);
      transform: translateX(-3px);
    }
  </style>
</head>
<body>

  <!-- Animated Background Canvas -->
  <canvas id="particle-canvas"></canvas>

  <!-- Glowing Grid Overlay -->
  <div class="grid-overlay"></div>

  <!-- Floating Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Main Wrapper -->
  <div class="main-wrapper" style="min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Navigation Bar -->
    <nav class="top-nav" id="top-nav">
      <div class="nav-brand">
        <span class="nav-logo-icon">⚡</span>
        <span class="nav-logo-text">THINK<span class="accent">TO BUILD</span></span>
      </div>
      <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/portals" class="nav-link">Portals</a>
        <a href="/register" class="nav-link nav-cta">Register Now</a>
      </div>
    </nav>

    <!-- Login Card -->
    <div class="container" style="flex: 1; display: flex; align-items: center; justify-content: center;">
      <div class="glass-card judge-login-card" id="judge-login-card">
        <span class="role-badge">⚖️ Judge Access</span>
        <h1>Judge Login</h1>
        <p style="margin-bottom: 30px; color: var(--text-secondary);">Enter your judge credentials to start scoring.</p>

        <div id="login-error" class="error-msg"></div>

        <form id="judge-login-form" style="display: flex; flex-direction: column; gap: 4px;">
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-group">
              <input type="email" id="email" placeholder="judge@email.com" required>
              <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" />
              </svg>
            </div>
          </div>
          
          <div class="form-group">
            <label>Password</label>
            <div class="input-group">
              <input type="password" id="password" placeholder="••••••••" required>
              <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
              <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('password', 'eye-icon')">
                <svg id="eye-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-premium" style="width: 100%; margin-top: 16px; background: linear-gradient(135deg, #60a5fa, #a78bfa) !important; box-shadow: 0 4px 15px rgba(96, 165, 250, 0.25) !important;">
            Sign In
            <div class="btn-shine"></div>
          </button>
        </form>

        <p style="text-align: center; margin-top: 28px;">
          <a href="/" class="back-home-link">← Back to Home</a>
        </p>
      </div>
    </div>

    <!-- Footer -->
    <footer class="main-footer" style="margin-top: auto; padding: 20px 0; border-top: 1px solid var(--border-subtle); background: rgba(5, 10, 24, 0.4); backdrop-filter: blur(10px);">
      <div class="footer-content" style="max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
        <div class="footer-brand" style="display: flex; align-items: center; gap: 8px;">
          <span class="nav-logo-icon" style="font-size: 1rem;">⚡</span>
          <span class="nav-logo-text" style="font-size: 0.9rem; letter-spacing: 2px;">THINK<span class="accent">TO BUILD</span></span>
        </div>
        <p class="footer-text" style="font-size: 0.8rem; color: var(--text-muted);">© 2026 Think to Build. All rights reserved.</p>
      </div>
    </footer>

  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="main.js"></script>
  <script>
    // Password visibility toggle helper
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
        `;
      } else {
        input.type = 'password';
        icon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        `;
      }
    }
  </script>
  <script src="/js/judge-login.js"></script>
</body>
</html>
